[project]
name = "research-backend"
version = "0.1.0"
description = "Free, local-first NotebookLM alternative for school"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "trafilatura>=2.2.0",
    "httpx>=0.28.1",
    "ddgs>=9.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pyinstaller>=6.22.2",
    "ruff>=0.17.0",
    "pyright>=1.1.414",
    "coverage>=7.16.2",
    "pip-audit>=2.10.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["core", "api", "scripts", "tests/platform/test_verification_configuration.py"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
data_file = "build/verification/.coverage"
branch = true
source = ["core", "api"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.notaeo.verification]
python_version = "3.12"
mandatory_dev_tools = ["ruff", "pyright", "coverage", "pip-audit"]
lint_scope = ["core", "api", "scripts", "tests/platform/test_verification_configuration.py"]
types_scope = ["core", "api", "scripts", "tests/platform/test_verification_configuration.py"]
coverage_source = ["core", "api"]
coverage_branch = true
lines_floor = 80
branches_floor = 80
combined_floor = 80
datadir = "build/verification"
build_workdir = "repository"
checks_workdir = "backend"

[tool.notaeo.verification.commands]
build = "sh backend/scripts/build_macos_sidecar.sh"
types = "uv run pyright"
lint = "uv run ruff check core api scripts tests/platform/test_verification_configuration.py"
tests = "uv run coverage run --branch --source=core,api -m pytest"
coverage_json = "uv run coverage json -o /tmp/notaeo-verification-coverage.json"
coverage_report = "uv run coverage report --fail-under=80"
security = "uv run pip-audit --local"
diff = "git diff --check"

[tool.notaeo.verification.touched]
scope_declaration_only = true
future_paths = [
  "core/verification.py",
  "scripts/verify.py",
  "tests/core/test_verification.py",
  "tests/platform/test_verification_cli.py",
]
